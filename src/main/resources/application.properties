spring.application.name=evidence-management-system

# DB connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evidence_db}
spring.datasource.username=${DB_USERNAME:vini}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:your_super_secret_key_must_be_at_least_32_characters_long}
jwt.expiration=${JWT_EXPIRATION:86400000}

file.upload.dir=uploads/evidence
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

aes.key=${AES_KEY:MySecretKey12345MySecretKey12345}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis